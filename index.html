        function cargarEstado() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    return normalizarEstado(parsed);
                }
            } catch (e) {
                console.error("Error cargando estado:", e);
            }
            return crearEstadoInicial();
        }

        function normalizarEstado(est) {
            const base = crearEstadoInicial();
            const merged = Object.assign({}, base, est || {});
            merged.empresaActual = Object.assign({}, base.empresaActual, (est && est.empresaActual) || {});
            merged.empresaActual.gananciasConfig = Object.assign(
                {},
                base.empresaActual.gananciasConfig,
                (merged.empresaActual && merged.empresaActual.gananciasConfig) || {}
            );
            merged.empresaActual.gananciasConfig.rentas = Object.assign(
                {},
                base.empresaActual.gananciasConfig.rentas,
                (merged.empresaActual.gananciasConfig && merged.empresaActual.gananciasConfig.rentas) || {}
            );
            merged.empresaActual.comprobantes = (merged.empresaActual.comprobantes || []).map(c => ({
                ...c,
                estadoDiario: c.estadoDiario || "BORRADOR",
                edicionDiario: c.edicionDiario || null
            }));
            merged.empresaActual.asientosManuales = (merged.empresaActual.asientosManuales || []).map(m => ({
                ...m,
                estadoDiario: m.estadoDiario || "BORRADOR",
                lineas: m.lineas || []
            }));
            return merged;
        }

        function fmtMoneda(valor, decimales = 2) {
            const num = Number(valor) || 0;
            return num.toLocaleString("es-AR", {
                minimumFractionDigits: decimales,
                maximumFractionDigits: decimales
            });
        }

        function parsearNumeroAr(texto) {
            if (typeof texto === "number") return isFinite(texto) ? texto : 0;
            if (!texto) return 0;
            const limpio = String(texto)
                .replace(/\$/g, "")
                .replace(/\s+/g, "")
                .replace(/\./g, "")
                .replace(",", ".");
            const n = parseFloat(limpio);
            return isNaN(n) ? 0 : n;
        }

        function formatearFechaAr(isoDate) {
            if (!isoDate || typeof isoDate !== "string") return "";
            const partes = isoDate.split("-");
            if (partes.length !== 3) return isoDate;
            return `${partes[2]}/${partes[1]}/${partes[0]}`;
        }

        function calcularRangoEjercicioPJ(mesCierre, anioCierre) {
            const m = String(mesCierre || "12").padStart(2, "0");
            const y = parseInt(anioCierre || "2026", 10);
            const ultimoDiaMes = new Date(y, parseInt(m, 10), 0).getDate();
            const fechaFin = `${y}-${m}-${String(ultimoDiaMes).padStart(2, "0")}`;

            let yInicio = y;
            let mInicio = parseInt(m, 10) + 1;
            if (mInicio > 12) {
                mInicio = 1;
            } else {
                yInicio = y - 1;
            }
            const fechaInicio = `${yInicio}-${String(mInicio).padStart(2, "0")}-01`;
            const esIrregular = m !== "12";

            return {
                fechaInicio,
                fechaFin,
                anioInicio: String(yInicio),
                anioCierre: String(y),
                esIrregular
            };
        }

        function calcularEscalaProgresiva(monto, tabla) {
            const val = Math.max(0, Number(monto) || 0);
            const tramo = tabla.find(t => val >= t.desde && val <= t.hasta) || tabla[tabla.length - 1];
            const excedente = Math.max(0, val - tramo.desde);
            const impuesto = tramo.fijo + excedente * tramo.alicuota;
            return { tramo, impuesto };
        }

        function obtenerImportesEfectivosComprobante(c) {
            const esVenta = c.tipoOp === "VENTA";
            const codigoNeto = c.cuentaNeto || (esVenta ? "4.1.01" : "5.1.01");
            const codigoIva = c.cuentaIva || (esVenta ? "2.1.02" : "1.1.03");
            const codigoOtros = c.cuentaOtrosTributos || "1.1.05";
            const codigoProvCliente = c.cuentaContrapartida || (esVenta ? "1.1.04" : "2.1.01");

            const baseNetaDef = (Number(c.netoTotal) || 0) + (Number(c.exento) || 0) + (Number(c.noGravado) || 0);
            const totIvaDef = Number(c.totalIva) || 0;
            const otrosTribDef = Number(c.otrosTributos) || 0;
            const totalCompDef = Number(c.total) || 0;

            const ed = c.edicionDiario || null;
            const baseNeta = ed && ed.baseNeta !== undefined ? Number(ed.baseNeta) : baseNetaDef;
            const totIva = ed && ed.totIva !== undefined ? Number(ed.totIva) : totIvaDef;
            const otrosTrib = ed && ed.otrosTrib !== undefined ? Number(ed.otrosTrib) : otrosTribDef;
            const totalComp = ed && ed.totalComp !== undefined ? Number(ed.totalComp) : totalCompDef;

            const debeAsiento = esVenta ? totalComp : (baseNeta + totIva + otrosTrib);
            const haberAsiento = esVenta ? (baseNeta + totIva + otrosTrib) : totalComp;

            return {
                esVenta,
                codigoNeto,
                codigoIva,
                codigoOtros,
                codigoProvCliente,
                baseNeta,
                totIva,
                otrosTrib,
                totalComp,
                debeAsiento,
                haberAsiento
            };
        }

        function obtenerMovimientosContablesPorRango(emp, fechaDesde, fechaHasta) {
            const mapaTipoCuenta = {};
            emp.planCuentas.forEach(p => {
                mapaTipoCuenta[p.codigo] = (p.tipo || "").toUpperCase();
            });

            const saldos = {};
            emp.planCuentas.forEach(p => {
                if (p.imputable) {
                    saldos[p.codigo] = {
                        codigo: p.codigo,
                        nombre: p.nombre,
                        tipo: (p.tipo || "").toUpperCase(),
                        debe: 0,
                        haber: 0
                    };
                }
            });

            const sumarLinea = (codigo, debe, haber) => {
                if (!codigo) return;
                if (!saldos[codigo]) {
                    saldos[codigo] = {
                        codigo,
                        nombre: codigo,
                        tipo: mapaTipoCuenta[codigo] || "",
                        debe: 0,
                        haber: 0
                    };
                }
                saldos[codigo].debe += Number(debe) || 0;
                saldos[codigo].haber += Number(haber) || 0;
            };

            (emp.comprobantes || [])
                .filter(c => c.fecha && (!fechaDesde || c.fecha >= fechaDesde) && (!fechaHasta || c.fecha <= fechaHasta))
                .forEach(c => {
                    const imp = obtenerImportesEfectivosComprobante(c);
                    if (imp.esVenta) {
                        sumarLinea(imp.codigoProvCliente, imp.totalComp, 0);
                        if (imp.baseNeta !== 0) sumarLinea(imp.codigoNeto, 0, imp.baseNeta);
                        if (imp.totIva !== 0) sumarLinea(imp.codigoIva, 0, imp.totIva);
                        if (imp.otrosTrib !== 0) sumarLinea(imp.codigoOtros, 0, imp.otrosTrib);
                    } else {
                        if (imp.baseNeta !== 0) sumarLinea(imp.codigoNeto, imp.baseNeta, 0);
                        if (imp.totIva !== 0) sumarLinea(imp.codigoIva, imp.totIva, 0);
                        if (imp.otrosTrib !== 0) sumarLinea(imp.codigoOtros, imp.otrosTrib, 0);
                        sumarLinea(imp.codigoProvCliente, 0, imp.totalComp);
                    }
                });

            (emp.asientosManuales || [])
                .filter(m => m.fecha && (!fechaDesde || m.fecha >= fechaDesde) && (!fechaHasta || m.fecha <= fechaHasta))
                .forEach(m => {
                    (m.lineas || []).forEach(l => {
                        sumarLinea(l.cuenta, l.debe, l.haber);
                    });
                });

            let ventasNetasResultados = 0;
            let gastosNetosResultados = 0;

            Object.values(saldos).forEach(acc => {
                const esIngreso = acc.tipo === "INGRESO" || acc.codigo.startsWith("4.");
                const esEgreso = acc.tipo === "EGRESO" || acc.codigo.startsWith("5.");
                if (esIngreso) {
                    ventasNetasResultados += (acc.haber - acc.debe);
                } else if (esEgreso) {
                    gastosNetosResultados += (acc.debe - acc.haber);
                }
            });

            return {
                saldos,
                ventasNetasResultados,
                gastosNetosResultados
            };
        }

        function obtenerAsientosUnificadosOrdenados() {
            const emp = obtenerEmpresaActual();
            const lista = [];

            (emp.comprobantes || []).forEach(c => {
                lista.push({ tipo: "COMPRA_VENTA", fecha: c.fecha, comp: c });
            });

            (emp.asientosManuales || []).forEach(m => {
                lista.push({ tipo: "MANUAL", fecha: m.fecha, manual: m });
            });

            lista.sort((a, b) => (a.fecha || "").localeCompare(b.fecha || ""));
            return lista;
        }

        function cambiarEstadoAsientoDiario(tipoAsiento, id, nuevoEstado) {
            const emp = obtenerEmpresaActual();
            if (tipoAsiento === "COMPRA_VENTA") {
                const c = emp.comprobantes.find(x => String(x.id) === String(id));
                if (!c) return;
                c.estadoDiario = nuevoEstado;
            } else {
                const m = (emp.asientosManuales || []).find(x => String(x.id) === String(id));
                if (!m) return;
                m.estadoDiario = nuevoEstado;
            }
            guardarEnLocalStorage();
            renderizarVista();
        }

        function actualizarCuentaAsiento(id, campo, nuevaCuenta) {
            const emp = obtenerEmpresaActual();
            const comp = emp.comprobantes.find(c => String(c.id) === String(id));
            if (!comp) return;
            if ((comp.estadoDiario || "BORRADOR") !== "BORRADOR") {
                alert("Este asiento está contabilizado. Pasalo a BORRADOR para editarlo.");
                renderizarVista();
                return;
            }
            if (campo === "neto") comp.cuentaNeto = nuevaCuenta;
            else if (campo === "iva") comp.cuentaIva = nuevaCuenta;
            else if (campo === "otrosTributos") comp.cuentaOtrosTributos = nuevaCuenta;
            else if (campo === "contrapartida") comp.cuentaContrapartida = nuevaCuenta;
            guardarEnLocalStorage();
            renderizarVista();
        }

        function guardarImporteComprobanteDiario(id, campoImporte, valorInput) {
            const emp = obtenerEmpresaActual();
            const c = emp.comprobantes.find(x => String(x.id) === String(id));
            if (!c) return;

            if ((c.estadoDiario || "BORRADOR") !== "BORRADOR") {
                alert("Este asiento está contabilizado. Pasalo a BORRADOR para editar sus importes.");
                renderizarVista();
                return;
            }

            const nuevoValor = Math.max(0, parsearNumeroAr(valorInput));
            const baseNetaDef = (Number(c.netoTotal) || 0) + (Number(c.exento) || 0) + (Number(c.noGravado) || 0);
            const totIvaDef = Number(c.totalIva) || 0;
            const otrosTribDef = Number(c.otrosTributos) || 0;
            const totalCompDef = Number(c.total) || 0;

            const edActual = c.edicionDiario || {
                baseNeta: baseNetaDef,
                totIva: totIvaDef,
                otrosTrib: otrosTribDef,
                totalComp: totalCompDef
            };

            const edPropuesto = { ...edActual, [campoImporte]: nuevoValor };
            const esVenta = c.tipoOp === "VENTA";
            const debeCalc = esVenta
                ? edPropuesto.totalComp
                : (edPropuesto.baseNeta + edPropuesto.totIva + edPropuesto.otrosTrib);
            const haberCalc = esVenta
                ? (edPropuesto.baseNeta + edPropuesto.totIva + edPropuesto.otrosTrib)
                : edPropuesto.totalComp;
            const diff = debeCalc - haberCalc;

            if (Math.abs(diff) > 0.01) {
                const ok = confirm(
                    `Aviso: el asiento quedará desbalanceado por $ ${fmtMoneda(diff)} (Debe: $ ${fmtMoneda(debeCalc)} | Haber: $ ${fmtMoneda(haberCalc)}).\n\n¿Deseás guardar este importe de todas formas?`
                );
                if (!ok) {
                    renderizarVista();
                    return;
                }
            }

            c.edicionDiario = edPropuesto;
            guardarEnLocalStorage();
            renderizarVista();
        }

        function guardarImporteManualDiario(idAsiento, idxLinea, columna, valorInput) {
            const emp = obtenerEmpresaActual();
            const m = (emp.asientosManuales || []).find(x => String(x.id) === String(idAsiento));
            if (!m || !m.lineas || !m.lineas[idxLinea]) return;

            if ((m.estadoDiario || "BORRADOR") !== "BORRADOR") {
                alert("Este asiento manual está contabilizado. Pasalo a BORRADOR para editar sus importes.");
                renderizarVista();
                return;
            }

            const nuevoValor = Math.max(0, parsearNumeroAr(valorInput));
            const lineasClon = m.lineas.map((l, i) => {
                if (i !== idxLinea) return { ...l };
                if (columna === "debe") {
                    return { ...l, debe: nuevoValor, haber: nuevoValor > 0 ? 0 : (Number(l.haber) || 0) };
                }
                return { ...l, haber: nuevoValor, debe: nuevoValor > 0 ? 0 : (Number(l.debe) || 0) };
            });

            let dMan = 0, hMan = 0;
            lineasClon.forEach(l => {
                dMan += Number(l.debe) || 0;
                hMan += Number(l.haber) || 0;
            });
            const diff = dMan - hMan;

            if (Math.abs(diff) > 0.01) {
                const ok = confirm(
                    `Aviso: el asiento manual quedará desbalanceado por $ ${fmtMoneda(diff)} (Debe: $ ${fmtMoneda(dMan)} | Haber: $ ${fmtMoneda(hMan)}).\n\n¿Deseás guardar este importe de todas formas?`
                );
                if (!ok) {
                    renderizarVista();
                    return;
                }
            }

            m.lineas = lineasClon;
            guardarEnLocalStorage();
            renderizarVista();
        }

            emp.asientosManuales = (emp.asientosManuales || []).filter(a => String(a.id) !== String(id));

        function actualizarEstadoBalanceModal() {
            const debeVals = document.querySelectorAll(".debe-manual");
            const haberVals = document.querySelectorAll(".haber-manual");
            const estado = document.getElementById("estadoBalanceModal");
            if (!estado) return;

            let totDebe = 0, totHaber = 0;
            for (let i = 0; i < debeVals.length; i++) {
                totDebe += parsearNumeroAr(debeVals[i].value);
                totHaber += parsearNumeroAr(haberVals[i].value);
            }
            const diff = totDebe - totHaber;
            estado.textContent = `Debe: $ ${fmtMoneda(totDebe)} | Haber: $ ${fmtMoneda(totHaber)} | Dif: $ ${fmtMoneda(diff)}`;
        }

        function guardarAsientoManual(e) {
            e.preventDefault();
            const emp = obtenerEmpresaActual();
            const fecha = document.getElementById("manualFecha").value;
            const concepto = document.getElementById("manualConcepto").value.trim();

            const ctas = document.querySelectorAll(".cta-manual");
            const debeVals = document.querySelectorAll(".debe-manual");
            const haberVals = document.querySelectorAll(".haber-manual");

            const lineas = [];
            let totDebe = 0, totHaber = 0;

            for (let i = 0; i < ctas.length; i++) {
                const cuenta = ctas[i].value;
                const debe = parsearNumeroAr(debeVals[i].value);
                const haber = parsearNumeroAr(haberVals[i].value);
                if (debe > 0 || haber > 0) {
                    lineas.push({ cuenta, debe, haber });
                    totDebe += debe;
                    totHaber += haber;
                }
            }

            if (lineas.length === 0) {
                alert("Ingresá al menos una línea con importe.");
                return;
            }

            const diff = totDebe - totHaber;
            if (Math.abs(diff) > 0.01) {
                const ok = confirm(
                    `Aviso: el asiento manual quedará desbalanceado por $ ${fmtMoneda(diff)} (Debe: $ ${fmtMoneda(totDebe)} | Haber: $ ${fmtMoneda(totHaber)}).\n\n¿Deseás guardarlo como borrador de todas formas?`
                );
                if (!ok) return;
            }

            emp.asientosManuales.push({
                id: Date.now(),
                fecha,
                concepto,
                estadoDiario: "BORRADOR",
                lineas
            });
            guardarEnLocalStorage();
            cerrarModalAsientoManual();
            renderizarVista();
        }

            const asientosOrdenados = obtenerAsientosUnificadosOrdenados().filter(item => {
                return item.fecha >= estadoApp.diarioFechaDesde && item.fecha <= estadoApp.diarioFechaHasta;
            });

            let txt = `================================================================================\n`;
            txt += `LIBRO DIARIO - ${emp.razonSocial}\n`;
            txt += `CUIT: ${emp.cuit} | Período: ${formatearFechaAr(estadoApp.diarioFechaDesde)} al ${formatearFechaAr(estadoApp.diarioFechaHasta)}\n`;
            txt += `================================================================================\n\n`;

            asientosOrdenados.forEach((item, i) => {
                const nro = i + 1;
                if (item.tipo === "COMPRA_VENTA") {
                    const c = item.comp;
                    const imp = obtenerImportesEfectivosComprobante(c);
                    txt += `Asiento N° ${nro} — Fecha: ${formatearFechaAr(c.fecha)} [${c.estadoDiario || "BORRADOR"}]\n`;
                    txt += `Ref: ${c.tipoNombre} ${String(c.pv || 0).padStart(4, "0")}-${String(c.numero || 0).padStart(8, "0")} - ${c.razonSocial}\n`;
                    txt += `--------------------------------------------------------------------------------\n`;
                    if (imp.esVenta) {
                        txt += `  [DEBE]  ${imp.codigoProvCliente} - ${mapaCuentas[imp.codigoProvCliente] || ""}: $ ${fmtMoneda(imp.totalComp)}\n`;
                        if (imp.baseNeta !== 0) txt += `  [HABER] ${imp.codigoNeto} - ${mapaCuentas[imp.codigoNeto] || ""}: $ ${fmtMoneda(imp.baseNeta)}\n`;
                        if (imp.totIva !== 0) txt += `  [HABER] ${imp.codigoIva} - ${mapaCuentas[imp.codigoIva] || ""}: $ ${fmtMoneda(imp.totIva)}\n`;
                        if (imp.otrosTrib !== 0) txt += `  [HABER] ${imp.codigoOtros} - ${mapaCuentas[imp.codigoOtros] || ""}: $ ${fmtMoneda(imp.otrosTrib)}\n`;
                    } else {
                        if (imp.baseNeta !== 0) txt += `  [DEBE]  ${imp.codigoNeto} - ${mapaCuentas[imp.codigoNeto] || ""}: $ ${fmtMoneda(imp.baseNeta)}\n`;
                        if (imp.totIva !== 0) txt += `  [DEBE]  ${imp.codigoIva} - ${mapaCuentas[imp.codigoIva] || ""}: $ ${fmtMoneda(imp.totIva)}\n`;
                        if (imp.otrosTrib !== 0) txt += `  [DEBE]  ${imp.codigoOtros} - ${mapaCuentas[imp.codigoOtros] || ""}: $ ${fmtMoneda(imp.otrosTrib)}\n`;
                        txt += `  [HABER] ${imp.codigoProvCliente} - ${mapaCuentas[imp.codigoProvCliente] || ""}: $ ${fmtMoneda(imp.totalComp)}\n`;
                    }
                } else {
                    const m = item.manual;
                    txt += `Asiento Manual N° ${nro} — Fecha: ${formatearFechaAr(m.fecha)} [${m.estadoDiario || "BORRADOR"}]\n`;
                    txt += `Concepto: ${m.concepto}\n`;
                    txt += `--------------------------------------------------------------------------------\n`;
                    (m.lineas || []).forEach(l => {
                        const esDebe = (Number(l.debe) || 0) > 0;
                        const imp = esDebe ? Number(l.debe) : Number(l.haber);
                        txt += `  ${esDebe ? "[DEBE] " : "[HABER]"} ${l.cuenta} - ${mapaCuentas[l.cuenta] || ""}: $ ${fmtMoneda(imp)}\n`;
                    });
                }
                txt += `--------------------------------------------------------------------------------\n\n`;
            });

            const blob = new Blob([txt], { type: "text/plain;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `Libro_Diario_${emp.cuit}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // ==========================================
        // GANANCIAS: SALDOS POR CUENTA DE RESULTADOS
        // ==========================================
        function actualizarGananciasField(ruta, valor, tipo = "num") {
            const cfg = obtenerEmpresaActual().gananciasConfig;
            let valParseado = valor;
            if (tipo === "num") valParseado = parsearNumeroAr(valor);
            else if (tipo === "int") valParseado = parseInt(valor, 10) || 0;
            else if (tipo === "bool") valParseado = Boolean(valor);

            if (ruta.startsWith("rentas.")) {
                const subKey = ruta.split(".")[1];
                cfg.rentas[subKey] = valParseado;
            } else {
                cfg[ruta] = valParseado;
            }
            guardarEnLocalStorage();
            renderizarVista();
        }

        function agregarDeduccionGeneralGanancias(e) {
            e.preventDefault();
            const cfg = obtenerEmpresaActual().gananciasConfig;
            const tipoId = document.getElementById("ganDedTipo").value;
            const meta = TIPOS_DEDUCCION_GENERAL.find(t => t.id === tipoId) || TIPOS_DEDUCCION_GENERAL[TIPOS_DEDUCCION_GENERAL.length - 1];
            const descripcion = document.getElementById("ganDedDesc").value.trim();
            const importe = Math.max(0, parsearNumeroAr(document.getElementById("ganDedMonto").value));

            if (!importe) return;
            cfg.deduccionesGenerales.push({
                id: Date.now(),
                tipoId,
                tipoLabel: meta.label,
                descripcion,
                importe
            });
            guardarEnLocalStorage();
            renderizarVista();
        }

        function eliminarDeduccionGeneralGanancias(id) {
            const cfg = obtenerEmpresaActual().gananciasConfig;
            cfg.deduccionesGenerales = (cfg.deduccionesGenerales || []).filter(d => String(d.id) !== String(id));
            guardarEnLocalStorage();
            renderizarVista();
        }

        function renderGanancias(cont) {
            const emp = obtenerEmpresaActual();
            const cfg = emp.gananciasConfig;

            const totalPagosCuenta =
                (Number(cfg.retencionesSufridas) || 0) +
                (Number(cfg.percepcionesSufridas) || 0) +
                (Number(cfg.anticiposIngresados) || 0) +
                (Number(cfg.saldoFavorAnterior) || 0);

            if (cfg.tipoSujeto === "PH") {
                const anio = cfg.anio || "2026";
                const params = PARAMS_GANANCIAS_ARCA[anio] || PARAMS_GANANCIAS_ARCA["2026"];
                const movAnio = obtenerMovimientosContablesPorRango(emp, `${anio}-01-01`, `${anio}-12-31`);
                const ventasAnioDiario = movAnio.ventasNetasResultados;
                const gastosAnioDiario = movAnio.gastosNetosResultados;

                const r = cfg.rentas;
                const netoCat1 = (Number(r.cat1Ingresos) || 0) - (Number(r.cat1Gastos) || 0);
                const netoCat2 = (Number(r.cat2Ingresos) || 0) - (Number(r.cat2Gastos) || 0);

                const ingCat3 = (cfg.vincularComprobantes3ra ? ventasAnioDiario : 0) + (Number(r.cat3IngresosManual) || 0);
                const gasCat3 = (cfg.vincularComprobantes3ra ? gastosAnioDiario : 0) + (Number(r.cat3GastosManual) || 0);
                const netoCat3 = ingCat3 - gasCat3;

                const netoCat4 = (Number(r.cat4Ingresos) || 0) - (Number(r.cat4Gastos) || 0);
                const gananciaNetaAntesDed = netoCat1 + netoCat2 + netoCat3 + netoCat4;

                let totalDedGeneralesDeclaradas = 0;
                let totalDedGeneralesComputables = 0;
                const baseTope5Porc = Math.max(0, gananciaNetaAntesDed);

                const filasDedGen = (cfg.deduccionesGenerales || []).map(d => {
                    const meta = TIPOS_DEDUCCION_GENERAL.find(t => t.id === d.tipoId) || { topeTipo: "SIN_TOPE" };
                    let topeAplicable = Infinity;
                    if (meta.topeTipo === "5_GNI") topeAplicable = baseTope5Porc * 0.05;
                    else if (meta.topeTipo === "SEGURO") topeAplicable = params.topeSeguroVida;
                    else if (meta.topeTipo === "GNI") topeAplicable = params.gni;
                    else if (meta.topeTipo === "40_GNI") topeAplicable = params.gni * 0.40;
                    else if (meta.topeTipo === "HIPOTECARIO") topeAplicable = params.topeHipotecario;
                    else if (meta.topeTipo === "SEPELIO") topeAplicable = params.topeSepelio;

                    const computable = Math.min(d.importe, topeAplicable);
                    const excedido = d.importe > topeAplicable;
                    totalDedGeneralesDeclaradas += d.importe;
                    totalDedGeneralesComputables += computable;

                    return `
                        <tr class="border-b hover:bg-gray-50 text-xs">
                            <td class="p-2.5 font-semibold text-gray-800">${d.tipoLabel}<br><span class="text-[11px] text-gray-400 font-normal">${d.descripcion}</span></td>
                            <td class="p-2.5 text-right num-row">$ ${fmtMoneda(d.importe)}</td>
                            <td class="p-2.5 text-right font-bold num-row ${excedido ? "text-amber-700" : "text-emerald-700"}">$ ${fmtMoneda(computable)}</td>

                            </td>
                        </tr>
                    `;
                }).join("");

                const gananciaNetaEjercicio = gananciaNetaAntesDed - totalDedGeneralesComputables;

                const dedGni = params.gni;
                const dedConyuge = cfg.conyuge ? params.conyuge : 0;
                const dedHijos = (parseInt(cfg.hijos, 10) || 0) * params.hijo;
                const dedHijosInc = (parseInt(cfg.hijosIncapacitados, 10) || 0) * params.hijoIncapacitado;

                let dedEspecialBase = 0;
                if (cfg.tipoDedEspecial === "AUTONOMO") dedEspecialBase = params.dedEspAutonomo;
                else if (cfg.tipoDedEspecial === "EMPRENDEDOR") dedEspecialBase = params.dedEspEmprendedor;
                else if (cfg.tipoDedEspecial === "REL_DEP") dedEspecialBase = params.dedEspRelDep;

                const doceavaParte = cfg.tipoDedEspecial === "REL_DEP"
                    ? (dedGni + dedConyuge + dedHijos + dedHijosInc + dedEspecialBase) / 12
                    : 0;

                const totalDedPersonalesTeoricas = dedGni + dedConyuge + dedHijos + dedHijosInc + dedEspecialBase + doceavaParte;
                const totalDedPersonalesComputables = gananciaNetaEjercicio > 0

                                    <tfoot class="bg-gray-100 font-black border-t-2 border-gray-800">
                                        <tr>
                                            <td colspan="3" class="p-2.5 uppercase">Ganancia Neta Antes de Deducciones Generales:</td>
                                            <td class="p-2.5 text-right text-blue-900 num-row">$ ${fmtMoneda(gananciaNetaAntesDed)}</td>
                                        </tr>
                                    </tfoot>
                                </table>
                            </div>
                        </div>

                        <div class="bg-white rounded-xl border shadow-sm p-4 sm:p-6 space-y-4">
                            <h3 class="text-sm sm:text-base font-bold text-gray-900 uppercase border-b pb-3">2. Deducciones Generales (Art. 85 LIG)</h3>
                            <form onsubmit="agregarDeduccionGeneralGanancias(event)" class="grid grid-cols-1 md:grid-cols-12 gap-2.5 bg-gray-50 p-3 rounded-xl border no-print">
                                <div class="md:col-span-5">
                                    <select id="ganDedTipo" class="w-full border rounded-lg p-2 text-xs font-semibold bg-white">
                                        ${TIPOS_DEDUCCION_GENERAL.map(t => `<option value="${t.id}">${t.label}</option>`).join("")}
                                    </select>
                                </div>
                                <div class="md:col-span-4">
                                    <input type="text" id="ganDedDesc" placeholder="Detalle / Comprobante" class="w-full border rounded-lg p-2 text-xs bg-white" />
                                </div>
                                <div class="md:col-span-2">
                                    <input type="text" inputmode="decimal" id="ganDedMonto" required placeholder="0,00" class="w-full border rounded-lg p-2 text-xs font-bold text-right bg-white num-row" />
                                </div>
                                <div class="md:col-span-1">
                                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-2 rounded-lg text-xs shadow flex items-center justify-center">
                                        <i data-lucide="plus" class="w-4 h-4"></i>
                                    </button>
                                </div>
                            </form>

                            <table class="w-full text-left text-xs">
                                <thead class="bg-gray-50 text-gray-500 uppercase font-bold border-b">
                                    <tr>
                                        <th class="p-2.5">Concepto</th>
                                        <th class="p-2.5 text-right">Cargado</th>
                                        <th class="p-2.5 text-right">Computable</th>
                                        <th class="p-2.5 text-center">Quitar</th>
                                    </tr>
                                </thead>
                                <tbody>${filasDedGen || `<tr><td colspan="4" class="text-center py-4 text-gray-400">Sin deducciones cargadas.</td></tr>`}</tbody>
                                <tfoot class="bg-gray-50 font-bold border-t">
                                    <tr>
                                        <td class="p-2.5 uppercase">Total Deducciones Generales:</td>
                                        <td class="p-2.5 text-right num-row">$ ${fmtMoneda(totalDedGeneralesDeclaradas)}</td>
                                        <td class="p-2.5 text-right text-emerald-700 num-row">- $ ${fmtMoneda(totalDedGeneralesComputables)}</td>
                                        <td></td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>

                        <div class="bg-white rounded-xl border shadow-sm p-4 sm:p-6 space-y-4">
                            <h3 class="text-sm sm:text-base font-bold text-gray-900 uppercase border-b pb-3">3. Deducciones Personales y Liquidación</h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs sm:text-sm">
                                <div class="space-y-2 bg-gray-50 p-4 rounded-xl border">
                                    <div class="flex justify-between"><span>Ganancia Neta del Ejercicio:</span><span class="font-bold num-row">$ ${fmtMoneda(gananciaNetaEjercicio)}</span></div>
                                    <div class="flex justify-between"><span>(-) Deducciones Personales Computables:</span><span class="font-bold text-emerald-700 num-row">- $ ${fmtMoneda(totalDedPersonalesComputables)}</span></div>
                                    <div class="flex justify-between border-t pt-2 font-bold"><span>Ganancia Neta Sujeta a Impuesto:</span><span class="num-row">$ ${fmtMoneda(gananciaNetaSujetaImpuesto)}</span></div>
                                    <div class="flex justify-between border-t pt-2 font-black text-blue-900 text-base"><span>IMPUESTO DETERMINADO:</span><span class="num-row">$ ${fmtMoneda(impuestoDeterminado)}</span></div>
                                </div>
                                <div class="space-y-2 bg-gray-50 p-4 rounded-xl border">
                                    <div class="flex justify-between items-center"><span>(-) Retenciones Ganancias:</span><input type="text" inputmode="decimal" value="${fmtMoneda(cfg.retencionesSufridas)}" onchange="actualizarGananciasField('retencionesSufridas', this.value)" class="w-28 text-right border rounded p-1 font-bold bg-white num-row" /></div>
                                    <div class="flex justify-between items-center"><span>(-) Percepciones Ganancias:</span><input type="text" inputmode="decimal" value="${fmtMoneda(cfg.percepcionesSufridas)}" onchange="actualizarGananciasField('percepcionesSufridas', this.value)" class="w-28 text-right border rounded p-1 font-bold bg-white num-row" /></div>
                                    <div class="flex justify-between items-center"><span>(-) Anticipos Ingresados:</span><input type="text" inputmode="decimal" value="${fmtMoneda(cfg.anticiposIngresados)}" onchange="actualizarGananciasField('anticiposIngresados', this.value)" class="w-28 text-right border rounded p-1 font-bold bg-white num-row" /></div>
                                    <div class="flex justify-between items-center"><span>(-) Saldo a Favor Anterior:</span><input type="text" inputmode="decimal" value="${fmtMoneda(cfg.saldoFavorAnterior)}" onchange="actualizarGananciasField('saldoFavorAnterior', this.value)" class="w-28 text-right border rounded p-1 font-bold bg-white num-row" /></div>
                                </div>
                            </div>
                            <div class="bg-slate-900 text-white p-4 rounded-xl flex justify-between items-center">
                                <span class="font-black text-sm sm:text-base">${saldoFinal >= 0 ? "SALDO A PAGAR GANANCIAS" : "SALDO A FAVOR"}</span>
                                <span class="text-xl sm:text-2xl font-black num-row">$ ${fmtMoneda(Math.abs(saldoFinal))}</span>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                const mesCierre = cfg.pjMesCierre || "12";
                const anioCierre = cfg.pjAnioCierre || cfg.anio || "2026";
                const rangoEj = calcularRangoEjercicioPJ(mesCierre, anioCierre);
                const anioTablaEscala = PARAMS_GANANCIAS_ARCA[rangoEj.anioInicio] ? rangoEj.anioInicio : (PARAMS_GANANCIAS_ARCA[rangoEj.anioCierre] ? rangoEj.anioCierre : "2026");
                const params = PARAMS_GANANCIAS_ARCA[anioTablaEscala] || PARAMS_GANANCIAS_ARCA["2026"];

                const movEj = obtenerMovimientosContablesPorRango(emp, rangoEj.fechaInicio, rangoEj.fechaFin);
                const ventasEjDiario = movEj.ventasNetasResultados;
                const gastosEjDiario = movEj.gastosNetosResultados;

                const ingTotales = (cfg.vincularComprobantesPJ ? ventasEjDiario : 0) + (Number(cfg.pjIngresosManual) || 0);
                const gasTotales = (cfg.vincularComprobantesPJ ? gastosEjDiario : 0) + (Number(cfg.pjCostosGastosManual) || 0);
                const resultadoContable = ingTotales - gasTotales;

                const ajustesImp = Number(cfg.pjAjustesImpositivos) || 0;
                const ajusteInflacion = Number(cfg.pjAjusteInflacion) || 0;
                const quebrantos = Math.max(0, Number(cfg.pjQuebrantosAnt) || 0);

                const gananciaNetaAntesQueb = resultadoContable + ajustesImp + ajusteInflacion;
                const quebrantosComputables = gananciaNetaAntesQueb > 0 ? Math.min(gananciaNetaAntesQueb, quebrantos) : 0;
                const gananciaNetaImponible = Math.max(0, gananciaNetaAntesQueb - quebrantosComputables);

                const resEscalaPJ = calcularEscalaProgresiva(gananciaNetaImponible, params.escalaPJ);
                const impuestoDeterminadoPJ = resEscalaPJ.impuesto;
                const saldoFinalPJ = impuestoDeterminadoPJ - totalPagosCuenta;

                cont.innerHTML = `
                    <div class="space-y-4 sm:space-y-6">
                        <div class="bg-white p-3.5 sm:p-5 rounded-xl border shadow-sm flex flex-wrap justify-between items-center gap-3">
                            <div>
                                <h2 class="text-lg sm:text-xl font-bold text-gray-900">Estimación Impuesto a las Ganancias — Persona Jurídica</h2>
                                <p class="text-xs text-gray-500 mt-0.5">Ejercicio Fiscal: <strong class="text-purple-900 num-row">${formatearFechaAr(rangoEj.fechaInicio)} al ${formatearFechaAr(rangoEj.fechaFin)}</strong></p>
                            </div>
                            <div class="flex flex-wrap items-center gap-2 sm:gap-3">
                                <div>
                                    <label class="block text-[10px] font-bold text-gray-500 uppercase">Tipo Sujeto</label>
                                    <select onchange="actualizarGananciasField('tipoSujeto', this.value, 'string')" class="text-xs border-2 border-purple-600 bg-purple-50 text-purple-900 rounded-lg p-1.5 font-bold">
                                        <option value="PH">Persona Humana (PH)</option>
                                        <option value="PJ" selected>Persona Jurídica (PJ - Sociedades)</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-[10px] font-bold text-gray-500 uppercase">Mes Cierre</label>
                                    <select onchange="actualizarGananciasField('pjMesCierre', this.value, 'string')" class="text-xs border rounded-lg p-1.5 font-bold bg-gray-50">
                                        ${Object.keys(NOMBRES_MESES).map(m => `<option value="${m}" ${mesCierre === m ? "selected" : ""}>${NOMBRES_MESES[m]} (${m})</option>`).join("")}
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-[10px] font-bold text-gray-500 uppercase">Año Cierre</label>
                                    <select onchange="actualizarGananciasField('pjAnioCierre', this.value, 'string')" class="text-xs border rounded-lg p-1.5 font-bold bg-gray-50">
                                        <option value="2025" ${anioCierre === "2025" ? "selected" : ""}>2025</option>
                                        <option value="2026" ${anioCierre === "2026" ? "selected" : ""}>2026</option>
                                        <option value="2027" ${anioCierre === "2027" ? "selected" : ""}>2027</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="bg-white rounded-xl border shadow-sm p-4 sm:p-6 space-y-4">
                            <div class="flex flex-wrap justify-between items-center border-b pb-3 gap-2">
                                <div>
                                    <h3 class="text-sm sm:text-base font-bold text-gray-900 uppercase">1. Resultado Contable y Ajustes Impositivos</h3>
                                    <p class="text-xs text-gray-500">Saldos netos por cuenta de resultado del Libro Diario (${formatearFechaAr(rangoEj.fechaInicio)} al ${formatearFechaAr(rangoEj.fechaFin)})</p>
                                </div>
                                <label class="flex items-center space-x-2 text-xs font-bold text-purple-900 bg-purple-50 px-3 py-1.5 rounded-lg border border-purple-200 cursor-pointer">
                                    <input type="checkbox" ${cfg.vincularComprobantesPJ ? "checked" : ""} onchange="actualizarGananciasField('vincularComprobantesPJ', this.checked, 'bool')" />
                                    <span>Vincular Libro Diario del Ejercicio</span>
                                </label>
                            </div>

                            ${cfg.vincularComprobantesPJ ? `
                            <div class="bg-gray-50 p-3 rounded-lg border text-xs flex flex-wrap justify-between gap-2">
                                <span class="font-semibold text-gray-700">Cuentas de Resultado en Libro Diario (${formatearFechaAr(rangoEj.fechaInicio)} - ${formatearFechaAr(rangoEj.fechaFin)}):</span>
                                <span class="font-bold text-blue-900 num-row">Ventas/Ingresos Netos: $ ${fmtMoneda(ventasEjDiario)} | Gastos/Costos Netos: $ ${fmtMoneda(gastosEjDiario)}</span>
                            </div>` : ""}

                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 text-xs">
                                <div class="bg-gray-50 p-3 rounded-xl border">
                                    <label class="block font-bold text-gray-700 uppercase mb-1">Otros Ingresos Manuales ($)</label>
                                    <input type="text" inputmode="decimal" value="${fmtMoneda(cfg.pjIngresosManual)}" onchange="actualizarGananciasField('pjIngresosManual', this.value)" class="w-full border rounded p-2 font-bold bg-white num-row" />
                                </div>
                                <div class="bg-gray-50 p-3 rounded-xl border">
                                    <label class="block font-bold text-gray-700 uppercase mb-1">Otros Gastos Manuales ($)</label>
                                    <input type="text" inputmode="decimal" value="${fmtMoneda(cfg.pjCostosGastosManual)}" onchange="actualizarGananciasField('pjCostosGastosManual', this.value)" class="w-full border rounded p-2 font-bold bg-white num-row" />
                                </div>
                                <div class="bg-blue-50 p-3 rounded-xl border border-blue-200">
                                    <label class="block font-bold text-blue-900 uppercase mb-1">Resultado Contable Antes Imp.</label>
                                    <div class="p-2 bg-white border rounded font-black text-sm num-row ${resultadoContable >= 0 ? "text-blue-900" : "text-red-600"}">$ ${fmtMoneda(resultadoContable)}</div>
                                </div>
                                <div class="bg-gray-50 p-3 rounded-xl border">
                                    <label class="block font-bold text-gray-700 uppercase mb-1">Ajustes Impositivos Netos (+/- $)</label>
                                    <input type="text" inputmode="decimal" value="${fmtMoneda(cfg.pjAjustesImpositivos)}" onchange="actualizarGananciasField('pjAjustesImpositivos', this.value)" class="w-full border rounded p-2 font-bold bg-white num-row" />
                                </div>
                                <div class="bg-gray-50 p-3 rounded-xl border">
                                    <label class="block font-bold text-gray-700 uppercase mb-1">Ajuste por Inflación (+/- $)</label>
                                    <input type="text" inputmode="decimal" value="${fmtMoneda(cfg.pjAjusteInflacion)}" onchange="actualizarGananciasField('pjAjusteInflacion', this.value)" class="w-full border rounded p-2 font-bold bg-white num-row" />
                                </div>
                                <div class="bg-gray-50 p-3 rounded-xl border">
                                    <label class="block font-bold text-gray-700 uppercase mb-1">Quebrantos Anteriores ($)</label>
                                    <input type="text" inputmode="decimal" value="${fmtMoneda(cfg.pjQuebrantosAnt)}" onchange="actualizarGananciasField('pjQuebrantosAnt', this.value)" class="w-full border rounded p-2 font-bold bg-white num-row" />
                                </div>
                            </div>
                        </div>

                        <div class="bg-white rounded-xl border shadow-sm p-4 sm:p-6 space-y-4">
                            <h3 class="text-sm sm:text-base font-bold text-gray-900 uppercase border-b pb-3">2. Determinación del Impuesto y Pagos a Cuenta</h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs sm:text-sm">
                                <div class="space-y-2 bg-gray-50 p-4 rounded-xl border">
                                    <div class="flex justify-between"><span>Ganancia Neta Imponible:</span><span class="font-bold num-row">$ ${fmtMoneda(gananciaNetaImponible)}</span></div>
                                    <div class="flex justify-between"><span>Alícuota Marginal Tramo:</span><span class="font-bold text-purple-800 num-row">${fmtMoneda(resEscalaPJ.tramo.alicuota * 100, 0)}%</span></div>
                                    <div class="flex justify-between border-t pt-2 font-black text-purple-950 text-base"><span>IMPUESTO DETERMINADO:</span><span class="num-row">$ ${fmtMoneda(impuestoDeterminadoPJ)}</span></div>
                                </div>
                                <div class="space-y-2 bg-gray-50 p-4 rounded-xl border">
                                    <div class="flex justify-between items-center"><span>(-) Retenciones Ganancias:</span><input type="text" inputmode="decimal" value="${fmtMoneda(cfg.retencionesSufridas)}" onchange="actualizarGananciasField('retencionesSufridas', this.value)" class="w-28 text-right border rounded p-1 font-bold bg-white num-row" /></div>
                                    <div class="flex justify-between items-center"><span>(-) Percepciones Ganancias:</span><input type="text" inputmode="decimal" value="${fmtMoneda(cfg.percepcionesSufridas)}" onchange="actualizarGananciasField('percepcionesSufridas', this.value)" class="w-28 text-right border rounded p-1 font-bold bg-white num-row" /></div>
                                    <div class="flex justify-between items-center"><span>(-) Anticipos Ingresados:</span><input type="text" inputmode="decimal" value="${fmtMoneda(cfg.anticiposIngresados)}" onchange="actualizarGananciasField('anticiposIngresados', this.value)" class="w-28 text-right border rounded p-1 font-bold bg-white num-row" /></div>
                                    <div class="flex justify-between items-center"><span>(-) Saldo a Favor Anterior:</span><input type="text" inputmode="decimal" value="${fmtMoneda(cfg.saldoFavorAnterior)}" onchange="actualizarGananciasField('saldoFavorAnterior', this.value)" class="w-28 text-right border rounded p-1 font-bold bg-white num-row" /></div>
                                </div>
                            </div>
                            <div class="bg-slate-900 text-white p-4 rounded-xl flex justify-between items-center">
                                <span class="font-black text-sm sm:text-base">${saldoFinalPJ >= 0 ? "SALDO A PAGAR GANANCIAS" : "SALDO A FAVOR"}</span>
                                <span class="text-xl sm:text-2xl font-black num-row">$ ${fmtMoneda(Math.abs(saldoFinalPJ))}</span>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        // ==========================================
        // RENDERIZADO GENERAL
        // ==========================================
        function renderizarVista() {
            const emp = obtenerEmpresaActual();
            document.getElementById("hdrRazonSocial").textContent = emp.razonSocial;
            document.getElementById("hdrMeta").textContent = `CUIT: ${emp.cuit} | ${emp.condicionIva}`;

            const botones = {
                diario: document.getElementById("btnNavDiario"),
                balance: document.getElementById("btnNavBalance"),
                ganancias: document.getElementById("btnNavGanancias")
            };

            Object.entries(botones).forEach(([key, btn]) => {
                if (!btn) return;
                if (estadoApp.vistaActual === key) {
                    btn.className = "px-3 py-1.5 rounded-lg bg-emerald-600 text-white";
                } else {
                    btn.className = "px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200";
                }
            });

            const cont = document.getElementById("contenedorPrincipal");
            if (estadoApp.vistaActual === "balance") {
                renderBalance(cont);
            } else if (estadoApp.vistaActual === "ganancias") {
                renderGanancias(cont);
            } else {
                renderLibroDiario(cont);
            }

            if (window.lucide && typeof window.lucide.createIcons === "function") {
                window.lucide.createIcons();
            }
        }

        document.addEventListener("DOMContentLoaded", renderizarVista);
    </script>
</body>
</html>
